<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Pan/tilt servo wiring diagram</title>
  <desc>Wiring for the get-off-my-lawn pan/tilt rig: host computer to Arduino over USB, Arduino pins 9 and 10 to servo signal wires, servo power from an external 5V supply, and all grounds joined on a breadboard rail.</desc>

  <rect x="0" y="0" width="1000" height="660" fill="#fbfbf9"/>

  <!-- ============ legend ============ -->
  <g font-size="13" fill="#44423d">
    <rect x="30" y="20" width="660" height="30" rx="6" fill="#ffffff" stroke="#ddd9d1"/>
    <line x1="46" y1="35" x2="76" y2="35" stroke="#d64545" stroke-width="4" stroke-linecap="round"/>
    <text x="82" y="40">+5V</text>
    <line x1="126" y1="35" x2="156" y2="35" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round"/>
    <text x="162" y="40">ground</text>
    <line x1="226" y1="35" x2="256" y2="35" stroke="#e08a1e" stroke-width="4" stroke-linecap="round"/>
    <text x="262" y="40">signal (PWM)</text>
    <line x1="366" y1="35" x2="396" y2="35" stroke="#9a968d" stroke-width="5" stroke-linecap="round"/>
    <text x="402" y="40">USB</text>
    <path d="M 452 42 L 452 38 C 462 34 462 26 452 22 L 452 18" fill="none" stroke="#2b2b2b" stroke-width="2.5"/>
    <text x="466" y="40">hop = wires cross, not connected</text>
  </g>

  <!-- ============ host computer ============ -->
  <g>
    <rect x="30" y="90" width="170" height="104" rx="8" fill="#ffffff" stroke="#c9c4ba" stroke-width="1.5"/>
    <text x="115" y="130" text-anchor="middle" font-size="15" font-weight="600" fill="#22211e">Mac or Pi 5</text>
    <text x="115" y="152" text-anchor="middle" font-size="12.5" fill="#6b6861">runs main.py</text>
    <text x="115" y="171" text-anchor="middle" font-size="12.5" fill="#6b6861">(YOLO + camera)</text>
  </g>

  <!-- USB cable -->
  <line x1="200" y1="142" x2="300" y2="142" stroke="#9a968d" stroke-width="6" stroke-linecap="round"/>
  <text x="250" y="130" text-anchor="middle" font-size="12" fill="#6b6861">USB</text>

  <!-- ============ arduino ============ -->
  <g>
    <rect x="300" y="90" width="220" height="200" rx="8" fill="#eef5f3" stroke="#5a8f86" stroke-width="1.5"/>
    <text x="410" y="124" text-anchor="middle" font-size="15" font-weight="600" fill="#22211e">Arduino</text>
    <text x="410" y="144" text-anchor="middle" font-size="12.5" fill="#6b6861">Uno or Nano</text>
    <text x="410" y="258" text-anchor="middle" font-size="11.5" fill="#6b6861">powered by USB</text>

    <!-- pin stubs -->
    <rect x="514" y="163" width="12" height="12" fill="#5a8f86"/>
    <text x="506" y="173" text-anchor="end" font-size="12.5" fill="#44423d">pin 9</text>
    <rect x="514" y="203" width="12" height="12" fill="#5a8f86"/>
    <text x="506" y="213" text-anchor="end" font-size="12.5" fill="#44423d">pin 10</text>
    <rect x="374" y="284" width="12" height="12" fill="#2b2b2b"/>
    <text x="394" y="281" font-size="12.5" fill="#44423d">GND</text>
  </g>

  <!-- ============ servos ============ -->
  <g>
    <rect x="600" y="86" width="160" height="112" rx="8" fill="#ffffff" stroke="#c9c4ba" stroke-width="1.5"/>
    <text x="680" y="116" text-anchor="middle" font-size="15" font-weight="600" fill="#22211e">Pan servo</text>
    <text x="680" y="138" text-anchor="middle" font-size="11.5" fill="#6b6861">signal → pin 9</text>
    <text x="680" y="156" text-anchor="middle" font-size="11.5" fill="#6b6861">red → +5V rail</text>
    <text x="680" y="174" text-anchor="middle" font-size="11.5" fill="#6b6861">brown → GND rail</text>
  </g>
  <g>
    <rect x="810" y="86" width="160" height="112" rx="8" fill="#ffffff" stroke="#c9c4ba" stroke-width="1.5"/>
    <text x="890" y="116" text-anchor="middle" font-size="15" font-weight="600" fill="#22211e">Tilt servo</text>
    <text x="890" y="138" text-anchor="middle" font-size="11.5" fill="#6b6861">signal → pin 10</text>
    <text x="890" y="156" text-anchor="middle" font-size="11.5" fill="#6b6861">red → +5V rail</text>
    <text x="890" y="174" text-anchor="middle" font-size="11.5" fill="#6b6861">brown → GND rail</text>
  </g>

  <!-- ============ breadboard ============ -->
  <rect x="280" y="400" width="700" height="150" rx="8" fill="#f2efe8" stroke="#d8d4cc" stroke-width="1.5"/>
  <text x="292" y="422" font-size="12" fill="#8a867d">breadboard</text>

  <!-- +5V rail -->
  <rect x="300" y="444" width="660" height="12" rx="6" fill="#d64545"/>
  <text x="300" y="438" font-size="12.5" font-weight="600" fill="#a8302f">+5V rail</text>
  <!-- GND rail -->
  <rect x="300" y="512" width="660" height="12" rx="6" fill="#2b2b2b"/>
  <text x="440" y="506" font-size="12.5" font-weight="600" fill="#2b2b2b">GND rail  —  everything shares this</text>

  <!-- ============ power supply ============ -->
  <g>
    <rect x="30" y="430" width="186" height="110" rx="8" fill="#ffffff" stroke="#c9c4ba" stroke-width="1.5"/>
    <text x="123" y="464" text-anchor="middle" font-size="15" font-weight="600" fill="#22211e">5V supply</text>
    <text x="123" y="486" text-anchor="middle" font-size="12.5" fill="#6b6861">2A+ (4A for MG996R)</text>
    <text x="123" y="508" text-anchor="middle" font-size="11.5" fill="#a8302f">separate from Arduino</text>
    <rect x="210" y="474" width="12" height="10" fill="#d64545"/>
    <rect x="210" y="518" width="12" height="10" fill="#2b2b2b"/>
  </g>

  <!-- supply +5V -> red rail -->
  <path d="M 222 479 L 258 479 L 258 450 L 300 450" fill="none" stroke="#d64545" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- supply GND -> gnd rail -->
  <path d="M 222 523 L 262 523 L 262 518 L 300 518" fill="none" stroke="#2b2b2b" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ============ signal wires ============ -->
  <!-- pin 9 -> pan signal -->
  <path d="M 526 169 L 562 169 L 562 112 L 600 112" fill="none" stroke="#e08a1e" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- pin 10 -> tilt signal, routed above the pan servo -->
  <path d="M 526 209 L 578 209 L 578 66 L 886 66 L 886 86" fill="none" stroke="#e08a1e" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ============ power wires to rails ============ -->
  <!-- pan servo red -> +5V rail -->
  <path d="M 648 198 L 648 450" fill="none" stroke="#d64545" stroke-width="3.5" stroke-linecap="round"/>
  <!-- tilt servo red -> +5V rail -->
  <path d="M 858 198 L 858 450" fill="none" stroke="#d64545" stroke-width="3.5" stroke-linecap="round"/>

  <!-- pan servo ground -> GND rail, hopping over the +5V rail (no connection) -->
  <path d="M 706 198 L 706 436 C 724 442 724 458 706 464 L 706 518" fill="none" stroke="#2b2b2b" stroke-width="3.5" stroke-linecap="round"/>
  <!-- tilt servo ground -> GND rail, hopping over the +5V rail -->
  <path d="M 916 198 L 916 436 C 934 442 934 458 916 464 L 916 518" fill="none" stroke="#2b2b2b" stroke-width="3.5" stroke-linecap="round"/>
  <!-- arduino GND -> GND rail, hopping over the +5V rail -->
  <path d="M 380 296 L 380 436 C 398 442 398 458 380 464 L 380 518" fill="none" stroke="#2b2b2b" stroke-width="3.5" stroke-linecap="round"/>

  <!-- junction dots where wires actually join a rail -->
  <g fill="#8c1f1f">
    <circle cx="648" cy="450" r="5"/>
    <circle cx="858" cy="450" r="5"/>
    <circle cx="300" cy="450" r="5"/>
  </g>
  <g fill="#000000">
    <circle cx="706" cy="518" r="5"/>
    <circle cx="916" cy="518" r="5"/>
    <circle cx="380" cy="518" r="5"/>
    <circle cx="300" cy="518" r="5"/>
  </g>

  <!-- ============ warning ============ -->
  <g>
    <rect x="30" y="586" width="940" height="52" rx="8" fill="#fdf3f1" stroke="#e0a9a3" stroke-width="1.5"/>
    <text x="50" y="609" font-size="13" font-weight="600" fill="#8c1f1f">Never connect the 5V supply to the Arduino’s 5V pin.</text>
    <text x="50" y="628" font-size="12.5" fill="#6b4340">Only the grounds are shared. The Arduino is powered by USB, the servos by the supply. Back-feeding the 5V pin can damage the board.</text>
  </g>
</svg>
