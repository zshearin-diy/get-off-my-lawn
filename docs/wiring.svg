<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 924" width="1000" height="924" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Pan/tilt and solenoid wiring diagram</title>
  <desc>Wiring for the get-off-my-lawn rig: host computer to Arduino over USB, pins 9 and 10 to the pan and tilt servo signal wires, pin 7 through a 220 ohm resistor to the gate of a MOSFET that switches a 12V 1.7A solenoid, a 10k ohm resistor from gate to source, servo power from a 5V supply, solenoid power from its own 12V supply with a flyback diode across the coil, and all grounds joined on a shared breadboard rail.</desc>

  <rect x="0" y="0" width="1000" height="924" fill="#fbfbf9"/>

  <!-- ============ legend ============ -->
  <g font-size="13" fill="#44423d">
    <rect x="30" y="20" width="940" height="30" rx="6" fill="#ffffff" stroke="#ddd9d1"/>
    <line x1="46" y1="35" x2="76" y2="35" stroke="#d64545" stroke-width="4" stroke-linecap="round"/>
    <text x="82" y="40">+V</text>
    <line x1="120" y1="35" x2="150" y2="35" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round"/>
    <text x="156" y="40">ground</text>
    <line x1="220" y1="35" x2="250" y2="35" stroke="#e08a1e" stroke-width="4" stroke-linecap="round"/>
    <text x="256" y="40">signal</text>
    <line x1="316" y1="35" x2="346" y2="35" stroke="#9a968d" stroke-width="5" stroke-linecap="round"/>
    <text x="352" y="40">USB</text>
    <path d="M 404 42 L 404 38 C 414 34 414 26 404 22 L 404 18" fill="none" stroke="#2b2b2b" stroke-width="2.5"/>
    <text x="418" y="40">hop = wires cross, not connected</text>
    <line x1="650" y1="35" x2="680" y2="35" stroke="#7a3fa0" stroke-width="4" stroke-linecap="round"/>
    <text x="686" y="40">coil to drain: +12V when idle, not ground</text>
  </g>

  <!-- ============ host computer ============ -->
  <g>
    <rect x="30" y="90" width="170" height="104" rx="8" fill="#ffffff" stroke="#c9c4ba" stroke-width="1.5"/>
    <text x="115" y="130" text-anchor="middle" font-size="15" font-weight="600" fill="#22211e">Mac or Pi 5</text>
    <text x="115" y="152" text-anchor="middle" font-size="12.5" fill="#6b6861">runs main.py</text>
    <text x="115" y="171" text-anchor="middle" font-size="12.5" fill="#6b6861">(YOLO + camera)</text>
  </g>

  <line x1="200" y1="142" x2="300" y2="142" stroke="#9a968d" stroke-width="6" stroke-linecap="round"/>
  <text x="250" y="130" text-anchor="middle" font-size="12" fill="#6b6861">USB</text>

  <!-- ============ arduino ============ -->
  <g>
    <rect x="300" y="90" width="220" height="230" rx="8" fill="#eef5f3" stroke="#5a8f86" stroke-width="1.5"/>
    <text x="410" y="124" text-anchor="middle" font-size="15" font-weight="600" fill="#22211e">Arduino</text>
    <text x="410" y="144" text-anchor="middle" font-size="12.5" fill="#6b6861">Uno or Nano</text>
    <text x="410" y="283" text-anchor="middle" font-size="11.5" fill="#6b6861">powered by USB</text>

    <rect x="514" y="163" width="12" height="12" fill="#5a8f86"/>
    <text x="506" y="173" text-anchor="end" font-size="12.5" fill="#44423d">pin 9</text>
    <rect x="514" y="203" width="12" height="12" fill="#5a8f86"/>
    <text x="506" y="213" text-anchor="end" font-size="12.5" fill="#44423d">pin 10</text>
    <rect x="294" y="243" width="12" height="12" fill="#5a8f86"/>
    <text x="314" y="253" font-size="12.5" fill="#44423d">pin 7</text>
    <rect x="374" y="314" width="12" height="12" fill="#2b2b2b"/>
    <text x="394" y="311" font-size="12.5" fill="#44423d">GND</text>
  </g>

  <!-- ============ servos ============ -->
  <g>
    <rect x="600" y="86" width="160" height="112" rx="8" fill="#ffffff" stroke="#c9c4ba" stroke-width="1.5"/>
    <text x="680" y="116" text-anchor="middle" font-size="15" font-weight="600" fill="#22211e">Pan servo</text>
    <text x="680" y="138" text-anchor="middle" font-size="11.5" fill="#6b6861">signal → pin 9</text>
    <text x="680" y="156" text-anchor="middle" font-size="11.5" fill="#6b6861">red → +5V rail</text>
    <text x="680" y="174" text-anchor="middle" font-size="11.5" fill="#6b6861">brown → GND rail</text>
  </g>
  <g>
    <rect x="810" y="86" width="160" height="112" rx="8" fill="#ffffff" stroke="#c9c4ba" stroke-width="1.5"/>
    <text x="890" y="116" text-anchor="middle" font-size="15" font-weight="600" fill="#22211e">Tilt servo</text>
    <text x="890" y="138" text-anchor="middle" font-size="11.5" fill="#6b6861">signal → pin 10</text>
    <text x="890" y="156" text-anchor="middle" font-size="11.5" fill="#6b6861">red → +5V rail</text>
    <text x="890" y="174" text-anchor="middle" font-size="11.5" fill="#6b6861">brown → GND rail</text>
  </g>

  <!-- signal wires to servos -->
  <path d="M 526 169 L 562 169 L 562 112 L 600 112" fill="none" stroke="#e08a1e" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 526 209 L 578 209 L 578 66 L 886 66 L 886 86" fill="none" stroke="#e08a1e" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ============ solenoid branch (left column) ============ -->
  <rect x="18" y="204" width="270" height="268" rx="8" fill="none" stroke="#9a968d" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="30" y="220" font-size="11.5" font-weight="600" fill="#6b6861">Heavy wiring: solder or screw terminals</text>

  <g>
    <rect x="30" y="228" width="130" height="68" rx="8" fill="#f4f1fa" stroke="#6f66a8" stroke-width="1.5"/>
    <text x="95" y="250" text-anchor="middle" font-size="14" font-weight="600" fill="#22211e">MOSFET</text>
    <text x="95" y="267" text-anchor="middle" font-size="11.5" fill="#6b6861">logic-level N-ch</text>
    <text x="95" y="283" text-anchor="middle" font-size="11.5" fill="#6b6861">IRLZ44N</text>
  </g>
  <g>
    <rect x="30" y="315" width="130" height="70" rx="8" fill="#ffffff" stroke="#c9c4ba" stroke-width="1.5"/>
    <text x="95" y="341" text-anchor="middle" font-size="15" font-weight="600" fill="#22211e">Solenoid</text>
    <text x="95" y="361" text-anchor="middle" font-size="11.5" fill="#6b6861">12V, 1.7A</text>
    <text x="95" y="378" text-anchor="middle" font-size="11.5" fill="#6b6861">coil — no polarity</text>
  </g>
  <g>
    <rect x="30" y="405" width="130" height="60" rx="8" fill="#ffffff" stroke="#c9c4ba" stroke-width="1.5"/>
    <text x="95" y="426" text-anchor="middle" font-size="14" font-weight="600" fill="#22211e">Solenoid supply</text>
    <text x="95" y="443" text-anchor="middle" font-size="11.5" fill="#6b6861">12V, 3A or more</text>
    <text x="95" y="458" text-anchor="middle" font-size="11.5" fill="#6b6861">not the servo supply</text>
  </g>

  <!-- pin 7 -> 220 ohm -> MOSFET gate -->
  <path d="M 294 249 L 160 249" fill="none" stroke="#e08a1e" stroke-width="3.5" stroke-linecap="round"/>
  <rect x="248" y="243" width="28" height="12" rx="2" fill="#ffffff" stroke="#44423d" stroke-width="1.5"/>
  <text x="262" y="238" text-anchor="middle" font-size="11" fill="#44423d">220Ω</text>
  <text x="172" y="243" font-size="11" fill="#8a867d">gate</text>

  <!-- 10k ohm from gate to source -->
  <path d="M 222 249 L 222 282" fill="none" stroke="#44423d" stroke-width="2"/>
  <rect x="216" y="255" width="12" height="21" rx="2" fill="#ffffff" stroke="#44423d" stroke-width="1.5"/>
  <text x="233" y="270" font-size="11" fill="#44423d">10kΩ</text>
  <circle cx="222" cy="249" r="4.5" fill="#e08a1e"/>

  <!-- heavy loop: supply + -> coil -> drain, source -> supply - -->
  <path d="M 95 296 L 95 315" fill="none" stroke="#7a3fa0" stroke-width="6" stroke-linecap="round"/>
  <path d="M 95 385 L 95 405" fill="none" stroke="#d64545" stroke-width="6" stroke-linecap="round"/>
  <path d="M 160 282 L 278 282 L 278 435 L 160 435" fill="none" stroke="#2b2b2b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="222" cy="282" r="5" fill="#000000"/>
  <text x="172" y="276" font-size="11" fill="#8a867d">source</text>
  <text x="84" y="309" text-anchor="end" font-size="11" fill="#8a867d">drain</text>

  <!-- flyback diode in parallel with the coil; band (cathode) toward +V -->
  <g>
    <path d="M 95 305 L 250 305 L 250 395 L 95 395" fill="none" stroke="#5a5f8f" stroke-width="2.5" stroke-linejoin="round"/>
    <polygon points="243,337 257,337 250,351" fill="#5a5f8f"/>
    <line x1="241" y1="353" x2="259" y2="353" stroke="#5a5f8f" stroke-width="3"/>
    <circle cx="95" cy="305" r="4.5" fill="#5a5f8f"/>
    <circle cx="95" cy="395" r="4.5" fill="#5a5f8f"/>
    <text x="202" y="333" text-anchor="middle" font-size="11.5" font-weight="600" fill="#5a5f8f">flyback</text>
    <text x="202" y="348" text-anchor="middle" font-size="11.5" font-weight="600" fill="#5a5f8f">diode</text>
    <text x="202" y="364" text-anchor="middle" font-size="11.5" fill="#5a5f8f">1N5408</text>
    <text x="202" y="379" text-anchor="middle" font-size="11.5" fill="#5a5f8f">band to +12V</text>
  </g>

  <!-- one thin ground wire ties the heavy loop to the rail -->
  <circle cx="278" cy="420" r="5" fill="#000000"/>
  <text x="294" y="412" font-size="11" fill="#8a867d">thin wire</text>

  <!-- ============ breadboard ============ -->
  <rect x="280" y="478" width="700" height="150" rx="8" fill="#f2efe8" stroke="#d8d4cc" stroke-width="1.5"/>
  <text x="292" y="620" font-size="12" fill="#8a867d">breadboard</text>

  <rect x="300" y="522" width="660" height="12" rx="6" fill="#d64545"/>
  <text x="404" y="516" font-size="12.5" font-weight="600" fill="#a8302f">+5V rail  (servos only)</text>
  <rect x="300" y="590" width="660" height="12" rx="6" fill="#2b2b2b"/>
  <text x="432" y="584" font-size="12.5" font-weight="600" fill="#2b2b2b">GND rail  —  every ground meets here</text>

  <!-- ============ servo 5V supply ============ -->
  <g>
    <rect x="30" y="508" width="186" height="110" rx="8" fill="#ffffff" stroke="#c9c4ba" stroke-width="1.5"/>
    <text x="123" y="542" text-anchor="middle" font-size="15" font-weight="600" fill="#22211e">5V supply</text>
    <text x="123" y="564" text-anchor="middle" font-size="12.5" fill="#6b6861">2A+ (4A for MG996R)</text>
    <text x="123" y="586" text-anchor="middle" font-size="11.5" fill="#a8302f">separate from Arduino</text>
    <rect x="210" y="552" width="12" height="10" fill="#d64545"/>
    <rect x="210" y="596" width="12" height="10" fill="#2b2b2b"/>
  </g>
  <path d="M 222 557 L 258 557 L 258 528 L 300 528" fill="none" stroke="#d64545" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 222 601 L 262 601 L 262 596 L 300 596" fill="none" stroke="#2b2b2b" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- solenoid loop's thin ground wire, drawn over the breadboard -->
  <path d="M 278 420 L 345 420 L 345 514 C 363 520 363 536 345 542 L 345 596" fill="none" stroke="#2b2b2b" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ============ servo power wires ============ -->
  <path d="M 648 198 L 648 528" fill="none" stroke="#d64545" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 858 198 L 858 528" fill="none" stroke="#d64545" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 706 198 L 706 514 C 724 520 724 536 706 542 L 706 596" fill="none" stroke="#2b2b2b" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 916 198 L 916 514 C 934 520 934 536 916 542 L 916 596" fill="none" stroke="#2b2b2b" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 380 326 L 380 514 C 398 520 398 536 380 542 L 380 596" fill="none" stroke="#2b2b2b" stroke-width="3.5" stroke-linecap="round"/>

  <!-- junction dots -->
  <g fill="#8c1f1f">
    <circle cx="648" cy="528" r="5"/>
    <circle cx="858" cy="528" r="5"/>
    <circle cx="300" cy="528" r="5"/>
  </g>
  <g fill="#000000">
    <circle cx="706" cy="596" r="5"/>
    <circle cx="916" cy="596" r="5"/>
    <circle cx="380" cy="596" r="5"/>
    <circle cx="300" cy="596" r="5"/>
    <circle cx="345" cy="596" r="5"/>
  </g>

  <!-- ============ warnings ============ -->
  <g>
    <rect x="30" y="660" width="940" height="52" rx="8" fill="#fdf3f1" stroke="#e0a9a3" stroke-width="1.5"/>
    <text x="50" y="683" font-size="13" font-weight="600" fill="#8c1f1f">Never wire the solenoid straight to pin 7.</text>
    <text x="50" y="702" font-size="12.5" fill="#6b4340">Pin 7 only switches the MOSFET. The 10kΩ resistor holds the MOSFET off while the pin floats during a reset or with the board unpowered.</text>
  </g>
  <g>
    <rect x="30" y="724" width="940" height="52" rx="8" fill="#fdf3f1" stroke="#e0a9a3" stroke-width="1.5"/>
    <text x="50" y="747" font-size="13" font-weight="600" fill="#8c1f1f">The flyback diode is not optional.</text>
    <text x="50" y="766" font-size="12.5" fill="#6b4340">Switching a coil off produces a large reverse voltage spike. Without a diode across the coil, that spike destroys the MOSFET.</text>
  </g>
  <g>
    <rect x="30" y="788" width="940" height="52" rx="8" fill="#fdf3f1" stroke="#e0a9a3" stroke-width="1.5"/>
    <text x="50" y="811" font-size="13" font-weight="600" fill="#8c1f1f">Neither supply’s + goes to the Arduino’s 5V pin.</text>
    <text x="50" y="830" font-size="12.5" fill="#6b4340">Only grounds are shared: Arduino, servo supply and solenoid supply all meet on the GND rail. The Arduino is powered by USB.</text>
  </g>
  <g>
    <rect x="30" y="852" width="940" height="52" rx="8" fill="#fdf3f1" stroke="#e0a9a3" stroke-width="1.5"/>
    <text x="50" y="875" font-size="13" font-weight="600" fill="#8c1f1f">Keep the solenoid's current off the breadboard.</text>
    <text x="50" y="894" font-size="12.5" fill="#6b4340">It draws 1.7A and a breadboard manages about 1A. Use 18–20 AWG wire for the thick lines, with one thin ground wire to the GND rail.</text>
  </g>
</svg>
